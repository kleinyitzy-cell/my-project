# =============================================================================
# Churchville Dental Care — Nginx Performance Configuration
# (Use this instead of .htaccess if the server runs Nginx)
# =============================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name churchvilledentalcare.com www.churchvilledentalcare.com;

    root /var/www/html;
    index index.php index.html;

    # ── SSL (managed by Certbot / Let's Encrypt) ─────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/churchvilledentalcare.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/churchvilledentalcare.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── Redirect www → non-www ────────────────────────────────────────────────
    if ($host = www.churchvilledentalcare.com) {
        return 301 https://churchvilledentalcare.com$request_uri;
    }

    # ── Gzip Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/x-javascript
        application/json application/xml application/rss+xml
        application/xhtml+xml image/svg+xml
        font/ttf font/otf font/woff font/woff2;

    # ── Brotli (requires ngx_brotli module) ──────────────────────────────────
    brotli on;
    brotli_comp_level 6;
    brotli_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;

    # ── Browser Cache Headers ─────────────────────────────────────────────────
    # HTML — always revalidate
    location ~* \.html?$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
    }

    # CSS, JS — 1 year (versioned by WordPress)
    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Images — 1 year
    location ~* \.(jpg|jpeg|png|gif|webp|avif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;

        # WebP/AVIF auto-serving: serve .webp if browser supports & file exists
        set $ext_avif "";
        set $ext_webp "";
        if ($http_accept ~* "image/avif") { set $ext_avif ".avif"; }
        if ($http_accept ~* "image/webp") { set $ext_webp ".webp"; }

        location ~* \.(jpg|jpeg|png)$ {
            add_header Vary "Accept";
            try_files $uri$ext_avif $uri$ext_webp $uri =404;
        }
    }

    # Fonts — 1 year + CORS
    location ~* \.(woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options   "nosniff"                     always;
    add_header X-Frame-Options          "SAMEORIGIN"                  always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── WordPress PHP handling ────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_intercept_errors on;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    # Block access to sensitive WP files
    location ~* /(?:wp-config\.php|xmlrpc\.php|readme\.html|license\.txt)$ {
        deny all;
    }
    location ~ /\. { deny all; }

    # ── Static file serving ───────────────────────────────────────────────────
    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name churchvilledentalcare.com www.churchvilledentalcare.com;
    return 301 https://churchvilledentalcare.com$request_uri;
}
